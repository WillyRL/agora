name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && swift --version
      - name: Keep Swift packages between runs
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: swiftpm-artifacts-${{ hashFiles('Package.resolved') }}

      - name: Fetch packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-packages.sh   # falls back to the GitHub API when release downloads fail

      - name: Build
        run: swift build
      - name: Test
        run: swift test
